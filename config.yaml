# config.yaml - QAT Training Configuration


experiment:
  name: "llama3.1_8b_wiki_1st_attempt"
  notes: "first attempt at llama 3.1 8b on wiki"
  tags: ["Llama3.1", "wikitext"]
# Model
model:
  name: "meta-llama/Meta-Llama-3.1-8B"
  num_bits_weight: 4
  num_bits_activation: 4
  block_size: 2048

# LoRA
lora:
  rank: 32
  alpha: 64
  dropout: 0.15
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", 
                   "gate_proj", "up_proj", "down_proj"]

# Calibration
calibration:
  num_samples: 128
  percentile: 99.5
  steps: 50
  alpha: 0.85
  learn_smooth: True
  calibrate_smooth: True

# Training
training:
  output_dir: "./output_qat_lora"
  num_epochs: 30
  batch_size: 16
  gradient_accumulation_steps: 2
  max_grad_norm: 5.0

  gradient_checkpointing: true
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  overwrite_output_dir: false

  # Learning Rate Schedule
  learning_rate: 1e-4
  warmup_ratio: 0.3
  lr_scheduler_type: "cosine"
  min_lr_rate: 0.1
  num_cycles: 3
  use_reentrant: False
  
  # Optimizer (per-parameter group)
  optimizer:
    lora_lr_multiplier: 1.0      
    clip_lr_multiplier: 10.0      
    smooth_lr_multiplier: 10.0   
    weight_decay: 0.001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
  
  # Logging
  logging_steps: 10
  save_strategy: "epoch"
  eval_strategy: "epoch"

# Dataset
dataset:
  # name: "alpaca"  # Options: "alpaca" or "wikitext"
  # uncoment rest for wikitext
  name: "wikitext"
  subset: "wikitext-2-raw-v1"
  train_split: "train"
  eval_split: "validation"

# System
system:
  seed: 42
  bf16: true
  tf32: true
  fp16: false
  dataloader_num_workers: 16
  dataloader_prefetch_factor: 4 
  dataloader_pin_memory: true 
